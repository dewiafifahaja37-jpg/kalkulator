<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kalkulator Hitam Biru</title>
    <style>
        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .calculator {
            background-color: #1e293b;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 300px;
            text-align: center;
            border: 2px solid #334155;
        }
        h2 {
            color: #f8fafc;
            margin: 0 0 16px 0;
            letter-spacing: 2px;
            font-size: 20px;
            font-weight: bold;
        }
        .display {
            background-color: #090d16;
            height: 60px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 16px;
            font-size: 28px;
            font-weight: bold;
            color: #38bdf8;
            box-sizing: border-box;
            border: 2px solid #1e293b;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            border: none;
            border-radius: 12px;
            height: 50px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.1s, background-color 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }

        /* Warna Tombol Hitam & Biru */
        .btn-number { 
            background-color: #0f172a; 
            color: #f8fafc;
            border: 1px solid #334155;
        }
        .btn-number:hover { background-color: #1e293b; }

        .btn-clear { 
            background-color: #ef4444; 
        }
        .btn-clear:hover { background-color: #dc2626; }

        .btn-operator { 
            background-color: #0284c7; 
        }
        .btn-operator:hover { background-color: #0369a1; }

        .btn-equal { 
            background-color: #3b82f6; 
        }
        .btn-equal:hover { background-color: #2563eb; }

        .span-2 { grid-column: span 2; }

        .hasil-text {
            margin-top: 18px;
            font-size: 15px;
            color: #94a3b8;
            font-weight: bold;
        }
        .hasil-text span {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <h2>KALKULATOR</h2>
        
        <div class="display" id="display">0</div>
        
        <div class="grid">
            <!-- Baris 1 -->
            <button onclick="clearDisplay()" class="btn-clear">C</button>
            <button onclick="backspace()" class="btn-clear">⌫</button>
            <button onclick="appendValue('/')" class="btn-operator">÷</button>
            <button onclick="appendValue('*')" class="btn-operator">×</button>

            <!-- Baris 2 -->
            <button onclick="appendValue('7')" class="btn-number">7</button>
            <button onclick="appendValue('8')" class="btn-number">8</button>
            <button onclick="appendValue('9')" class="btn-number">9</button>
            <button onclick="appendValue('-')" class="btn-operator">-</button>

            <!-- Baris 3 -->
            <button onclick="appendValue('4')" class="btn-number">4</button>
            <button onclick="appendValue('5')" class="btn-number">5</button>
            <button onclick="appendValue('6')" class="btn-number">6</button>
            <button onclick="appendValue('+')" class="btn-operator">+</button>

            <!-- Baris 4 -->
            <button onclick="appendValue('1')" class="btn-number">1</button>
            <button onclick="appendValue('2')" class="btn-number">2</button>
            <button onclick="appendValue('3')" class="btn-number">3</button>
            <button onclick="calculateResult()" class="btn-equal">=</button>

            <!-- Baris 5 -->
            <button onclick="appendValue('.')" class="btn-number">.</button>
            <button onclick="appendValue('0')" class="btn-number span-2">0</button>
        </div>

        <div class="hasil-text">Hasil: <span id="hasil">0</span></div>
    </div>

    <!-- Panggil file JS terpisah -->
    <script src="script.js"></script>
</body>
</html>
